# EVALSURE — Docker Compose (local / reproducible)
# Copy .env.example → .env, then: docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evalsure}
      POSTGRES_USER: ${POSTGRES_USER:-evalsure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evalsure}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-evalsure} -d ${POSTGRES_DB:-evalsure}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-EVALSURE}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-evalsure}:${POSTGRES_PASSWORD:-evalsure}@db:5432/${POSTGRES_DB:-evalsure}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-evalsure}:${POSTGRES_PASSWORD:-evalsure}@db:5432/${POSTGRES_DB:-evalsure}
      EVALSURE_JWT_SECRET: ${EVALSURE_JWT_SECRET:?Set EVALSURE_JWT_SECRET in .env}
      EVALSURE_JWT_ALGORITHM: ${EVALSURE_JWT_ALGORITHM:-HS256}
      EVALSURE_ACCESS_TOKEN_EXPIRE_MINUTES: ${EVALSURE_ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      EVALSURE_CORS_ORIGINS: ${EVALSURE_CORS_ORIGINS:-http://localhost:3000}
      EVALSURE_JUDGE_PROVIDER: ${EVALSURE_JUDGE_PROVIDER:-openai_compatible}
      EVALSURE_JUDGE_MODEL: ${EVALSURE_JUDGE_MODEL:-gpt-4o-mini}
      EVALSURE_JUDGE_API_KEY: ${EVALSURE_JUDGE_API_KEY:-}
      EVALSURE_JUDGE_BASE_URL: ${EVALSURE_JUDGE_BASE_URL:-https://api.openai.com/v1}
      EVALSURE_JUDGE_TIMEOUT_SECONDS: ${EVALSURE_JUDGE_TIMEOUT_SECONDS:-60}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server-side RSC / auth BFF → API over the Compose network
      EVALSURE_API_INTERNAL_URL: ${EVALSURE_API_INTERNAL_URL:-http://api:8000}
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
